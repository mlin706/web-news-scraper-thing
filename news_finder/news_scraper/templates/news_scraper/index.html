{% extends "base.html" %}

{% block content %}
    <h1> BBC News Articles: </h1>
    {% for tag in tags %}
        <div class="card">
            <div> {{ tag.date }} </div>
            <h2 class="article-title"> {{ tag.title }} </h2>
            <p> {{ tag.description }} </p>
            <a href="{{ tag.link }}">Read more...</a>
        </div>
    {% endfor %}
{% endblock content %}
